services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - platform-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - platform-net

  auth-service:
    build: ./services/auth-service
    restart: unless-stopped
    ports:
      - "8001:8080"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - platform-net

  quota-service:
    build: ./services/quota-service
    restart: unless-stopped
    ports:
      - "8003:8080"
    env_file: .env
    depends_on:
      - redis
    networks:
      - platform-net

  task-service:
    build: ./services/task-service
    restart: unless-stopped
    ports:
      - "8002:8080"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - platform-net

  broker-worker:
    build:
      context: ./services
      dockerfile: broker-worker/Dockerfile
    restart: unless-stopped
    ports:
      - "8004:8080"
    env_file: .env
    environment:
      AGENT_WORKER_URL: http://agent-worker:8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - platform-net

  agent-worker:
    build:
      context: ./services
      dockerfile: agent-worker/Dockerfile
    restart: unless-stopped
    ports:
      - "8005:8080"
    env_file: .env
    environment:
      TASK_SERVICE_URL: http://task-service:8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - platform-net

  api-gateway:
    build:
      context: ./services
      dockerfile: api-gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8080"
    env_file: .env
    environment:
      AUTH_SERVICE_URL: http://auth-service:8080
      TASK_SERVICE_URL: http://task-service:8080
      QUOTA_SERVICE_URL: http://quota-service:8080
    depends_on:
      - auth-service
      - task-service
      - quota-service
    networks:
      - platform-net

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    networks:
      - platform-net

volumes:
  postgres_data:

networks:
  platform-net:
    driver: bridge
