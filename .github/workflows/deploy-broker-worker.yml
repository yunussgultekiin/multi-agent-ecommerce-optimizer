name: Deploy broker-worker

on:
  push:
    branches: [main]
    paths:
      - "services/broker-worker/**"
      - ".github/workflows/deploy-broker-worker.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for GAR
        run: gcloud auth configure-docker ${{ secrets.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build and push
        run: |
          IMAGE="${{ secrets.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GAR_REPO }}/broker-worker"
          docker build -f ./services/broker-worker/Dockerfile -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ./services
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          IMAGE="${{ secrets.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GAR_REPO }}/broker-worker"
          ENV_VARS="APP_ENV=${{ secrets.APP_ENV }},LOG_LEVEL=${{ secrets.LOG_LEVEL }},BROKER_DATABASE_URL=${{ secrets.BROKER_DATABASE_URL }},REDIS_URL=${{ secrets.REDIS_URL }},JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }},JWT_ALGORITHM=${{ secrets.JWT_ALGORITHM }},TASK_QUEUE_NAME=${{ secrets.TASK_QUEUE_NAME }},MAX_RETRY_COUNT=${{ secrets.MAX_RETRY_COUNT }},RETRY_BASE_DELAY=${{ secrets.RETRY_BASE_DELAY }},TASK_SERVICE_URL=${{ secrets.TASK_SERVICE_URL }},AGENT_WORKER_URL=${{ secrets.AGENT_WORKER_URL }}"
          gcloud run deploy broker-worker \
            --image="$IMAGE:${{ github.sha }}" \
            --region="${{ secrets.GCP_REGION }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --service-account="broker-worker-sa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --add-cloudsql-instances="${{ secrets.CLOUD_SQL_INSTANCE }}" \
            --vpc-connector="${{ secrets.VPC_CONNECTOR }}" \
            --vpc-egress=private-ranges-only \
            --set-env-vars="$ENV_VARS"
          URL=$(gcloud run services describe broker-worker \
            --region="${{ secrets.GCP_REGION }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --format='value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Deployment Summary
        run: |
          echo "## broker-worker deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
